```html
<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>gustavo.</title>

  <!-- Vercel Analytics -->
  <script defer src="/_vercel/insights/script.js"></script>

  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    html,
    body {
      width: 100%;
      height: 100%;
    }

    body {
      position: relative;
      overflow: hidden;

      display: flex;
      align-items: center;
      justify-content: center;

      font-family: Arial, Helvetica, sans-serif;

      background:
        radial-gradient(
          circle at 50% 50%,
          #ffffff 0%,
          #f7f7f5 45%,
          #eeeeeb 100%
        );

      color: #111;
    }

    /* Luzes suaves no fundo */
    body::before,
    body::after {
      content: "";
      position: absolute;

      width: 45vw;
      height: 45vw;

      max-width: 600px;
      max-height: 600px;

      border-radius: 50%;

      filter: blur(90px);

      pointer-events: none;

      opacity: 0.35;

      animation: ambient 12s ease-in-out infinite alternate;
    }

    body::before {
      top: -20%;
      left: -10%;

      background: rgba(180, 190, 255, 0.18);
    }

    body::after {
      right: -10%;
      bottom: -20%;

      background: rgba(220, 200, 255, 0.16);

      animation-delay: -6s;
    }

    /* Nome */
    .name {
      position: relative;
      z-index: 2;

      font-size: clamp(3.5rem, 11vw, 9rem);

      font-weight: 500;

      letter-spacing: -0.07em;

      color: #111;

      user-select: none;
      cursor: default;

      animation:
        floating 6s ease-in-out infinite,
        fadeIn 1.4s ease-out forwards;

      transition:
        transform 0.5s ease,
        opacity 0.5s ease,
        letter-spacing 0.5s ease;
    }

    /* Pequeno efeito ao passar o mouse */
    .name:hover {
      opacity: 0.65;
      letter-spacing: -0.04em;
    }

    /* Movimento flutuante */
    @keyframes floating {
      0% {
        transform: translateY(0px);
      }

      25% {
        transform: translateY(-8px);
      }

      50% {
        transform: translateY(-15px);
      }

      75% {
        transform: translateY(-6px);
      }

      100% {
        transform: translateY(0px);
      }
    }

    /* Movimento ambiente do fundo */
    @keyframes ambient {
      0% {
        transform: translate(0, 0) scale(1);
      }

      50% {
        transform: translate(30px, -20px) scale(1.08);
      }

      100% {
        transform: translate(-20px, 25px) scale(1);
      }
    }

    /* Entrada suave */
    @keyframes fadeIn {
      from {
        opacity: 0;
        transform: translateY(15px);
      }

      to {
        opacity: 1;
      }
    }

    /* Celulares */
    @media (max-width: 600px) {
      body::before,
      body::after {
        width: 70vw;
        height: 70vw;

        filter: blur(70px);
      }

      .name {
        font-size: 18vw;
      }
    }

    /* Respeita usuários que preferem menos animações */
    @media (prefers-reduced-motion: reduce) {
      .name,
      body::before,
      body::after {
        animation: none;
      }
    }
  </style>
</head>

<body>

  <div class="name">gustavo.</div>

</body>
</html>
