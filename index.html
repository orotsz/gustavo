<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>gustavo</title>
  
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,400;1,400&display=swap" rel="stylesheet">

  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      background-color: #0a0a0a;
      color: #e5e5e5;
      font-family: 'Playfair Display', Georgia, serif;
      overflow: hidden;
    }

    h1 {
      font-size: clamp(3.5rem, 11vw, 9rem);
      font-weight: 400;
      font-style: italic;
      letter-spacing: -0.02em;
      text-transform: lowercase;
      user-select: none;
      cursor: pointer;
      opacity: 0.9;
      
      /* Transição suave para interações */
      transition: transform 0.6s cubic-bezier(0.16, 1, 0.3, 1), 
                  opacity 0.6s ease, 
                  letter-spacing 0.6s ease;
    }

    /* Efeito de expansão elegante no Hover */
    h1:hover {
      opacity: 1;
      letter-spacing: 0.02em;
    }

    /* Toque/Clique sutil */
    h1:active {
      transform: scale(0.97) !important;
      opacity: 0.7;
    }
  </style>

  <script defer src="/_vercel/insights/script.js"></script>
</head>
<body>

  <h1 id="title">gustavo</h1>

  <script>
    const title = document.getElementById('title');

    // Movimento magnético ultra-suave com o mouse
    window.addEventListener('mousemove', (e) => {
      const { innerWidth, innerHeight } = window;
      
      // Deslocamento milimétrico para manter o ar sofisticado
      const x = (e.clientX / innerWidth - 0.5) * 20;
      const y = (e.clientY / innerHeight - 0.5) * 20;

      title.style.transform = `translate3d(${x}px, ${y}px, 0)`;
    });

    document.addEventListener('mouseleave', () => {
      title.style.transform = 'translate3d(0, 0, 0)';
    });
  </script>

</body>
</html>
