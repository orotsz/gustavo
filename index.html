<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>gustavo</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      background-color: #000000;
      color: #ffffff;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      overflow: hidden;
    }

    h1 {
      font-size: clamp(4rem, 12vw, 10rem);
      font-weight: 300;
      letter-spacing: -0.05em;
      text-transform: lowercase;
      user-select: none;
      cursor: default;
      will-change: transform, filter;
      
      /* Animação suave contínua */
      animation: float 6s ease-in-out infinite;
      transition: transform 0.2s cubic-bezier(0.25, 1, 0.5, 1), filter 0.4s ease;
    }

    /* Animação minimalista de flutuação */
    @keyframes float {
      0%, 100% {
        transform: translate(0, 0) rotate(0deg);
      }
      33% {
        transform: translate(-10px, -15px) rotate(-0.5deg);
      }
      66% {
        transform: translate(10px, -8px) rotate(0.5deg);
      }
    }

    /* Estado ativado ao clicar */
    h1:active {
      transform: scale(0.95) !important;
      filter: blur(1px);
    }
  </style>

  <script defer src="/_vercel/insights/script.js"></script>
</head>
<body>

  <h1 id="title">gustavo</h1>

  <script>
    const title = document.getElementById('title');

    // Movimento responsivo sutil ao passar o mouse
    window.addEventListener('mousemove', (e) => {
      const { innerWidth, innerHeight } = window;
      
      // Calcula o deslocamento do mouse em relação ao centro (-1 a 1)
      const x = (e.clientX / innerWidth - 0.5) * 2;
      const y = (e.clientY / innerHeight - 0.5) * 2;

      // Inclinamento e deslocamento milimétrico e orgânico
      const moveX = x * 15; 
      const moveY = y * 15;
      const rotate = x * 2;

      title.style.transform = `translate(${moveX}px, ${moveY}px) rotate(${rotate}deg)`;
      title.style.textShadow = `${-moveX * 0.5}px ${-moveY * 0.5}px 25px rgba(255, 255, 255, 0.15)`;
    });

    // Retorna suavemente ao padrão quando o mouse sai da tela
    document.addEventListener('mouseleave', () => {
      title.style.transform = '';
      title.style.textShadow = 'none';
    });
  </script>

</body>
</html>
