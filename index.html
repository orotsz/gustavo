<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>gustavo.</title>
  
  <!-- Fonte moderna e ultra-nítida (Outfit) -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;500;700&display=swap" rel="stylesheet">

  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      width: 100vw;
      height: 100vh;
      overflow: hidden;
      display: flex;
      justify-content: center;
      align-items: center;
      font-family: 'Outfit', -apple-system, BlinkMacSystemFont, sans-serif;
      background: linear-gradient(180deg, #74b9ff 0%, #a1c4fd 40%, #c2e9fb 100%);
      color: #ffffff;
      user-select: none;
      -webkit-font-smoothing: antialiased;
      -moz-osx-font-smoothing: grayscale;
    }

    /* Container de Iluminação do Céu */
    .sky-container {
      position: absolute;
      inset: 0;
      overflow: hidden;
      pointer-events: none;
    }

    /* Sol / Glow de Luz Suave */
    .sun-glow {
      position: absolute;
      top: -10vw;
      left: 50%;
      transform: translateX(-50%);
      width: 60vw;
      height: 60vw;
      max-width: 800px;
      max-height: 800px;
      background: radial-gradient(circle, rgba(255, 255, 255, 0.6) 0%, rgba(255, 255, 255, 0) 70%);
      filter: blur(40px);
      animation: pulseGlow 8s ease-in-out infinite alternate;
    }

    @keyframes pulseGlow {
      0% { opacity: 0.6; transform: translateX(-50%) scale(0.95); }
      100% { opacity: 0.9; transform: translateX(-50%) scale(1.05); }
    }

    /* Camadas de Nuvens em Vetor (Nítidas & Suaves) */
    .cloud {
      position: absolute;
      fill: rgba(255, 255, 255, 0.45);
      filter: blur(12px);
      will-change: transform;
    }

    .cloud-1 {
      bottom: -5%;
      left: -10%;
      width: 70vw;
      opacity: 0.7;
      animation: driftSlow 35s ease-in-out infinite alternate;
    }

    .cloud-2 {
      bottom: -10%;
      right: -15%;
      width: 75vw;
      opacity: 0.6;
      animation: driftMedium 28s ease-in-out infinite alternate;
    }

    .cloud-3 {
      top: 10%;
      left: -20%;
      width: 50vw;
      opacity: 0.35;
      animation: driftFast 42s ease-in-out infinite alternate;
    }

    @keyframes driftSlow {
      0% { transform: translate(0, 0) scale(1); }
      100% { transform: translate(6vw, -3vh) scale(1.05); }
    }

    @keyframes driftMedium {
      0% { transform: translate(0, 0) scale(1); }
      100% { transform: translate(-8vw, -4vh) scale(1.08); }
    }

    @keyframes driftFast {
      0% { transform: translate(0, 0); }
      100% { transform: translate(12vw, 2vh); }
    }

    /* Conteúdo Central */
    .content {
      position: relative;
      z-index: 10;
      text-align: center;
      cursor: pointer;
      padding: 2rem;
    }

    h1 {
      font-size: clamp(4rem, 14vw, 12rem);
      font-weight: 500;
      letter-spacing: -0.04em;
      text-transform: lowercase;
      color: rgba(255, 255, 255, 0.95);
      text-shadow: 0 10px 30px rgba(70, 115, 170, 0.25);
      transition: transform 0.3s cubic-bezier(0.2, 0.8, 0.2, 1), text-shadow 0.3s ease;
      animation: floatText 6s ease-in-out infinite;
    }

    .dot {
      display: inline-block;
      color: #ffffff;
      transition: transform 0.4s cubic-bezier(0.34, 1.56, 0.64, 1);
    }

    .content:hover h1 {
      text-shadow: 0 15px 45px rgba(255, 255, 255, 0.4);
    }

    .content:hover .dot {
      transform: translateY(-8px) scale(1.2);
    }

    .content:active h1 {
      transform: scale(0.96) !important;
    }

    @keyframes floatText {
      0%, 100% {
        transform: translateY(0px);
      }
      50% {
        transform: translateY(-12px);
      }
    }

    /* Brisa ao clicar */
    .ripple {
      position: absolute;
      border-radius: 50%;
      background: radial-gradient(circle, rgba(255, 255, 255, 0.5) 0%, rgba(255, 255, 255, 0) 70%);
      transform: scale(0);
      animation: rippleEffect 0.8s ease-out forwards;
      pointer-events: none;
      z-index: 5;
    }

    @keyframes rippleEffect {
      to {
        transform: scale(4);
        opacity: 0;
      }
    }
  </style>

  <!-- Script para rastreamento do Vercel Analytics -->
  <script defer src="/_vercel/insights/script.js"></script>
</head>
<body>

  <!-- Iluminação e Nuvens em Vetor SVG (100% Nítidas) -->
  <div class="sky-container">
    <div class="sun-glow"></div>

    <!-- Nuvem 1 -->
    <svg class="cloud cloud-1" viewBox="0 0 600 300" xmlns="http://www.w3.org/2000/svg">
      <path d="M150 220 C100 220 60 180 80 130 C100 80 160 70 200 90 C230 40 310 30 360 70 C410 40 480 60 500 110 C540 120 570 160 550 200 C530 230 480 230 450 220 Z"/>
    </svg>

    <!-- Nuvem 2 -->
    <svg class="cloud cloud-2" viewBox="0 0 700 350" xmlns="http://www.w3.org/2000/svg">
      <path d="M200 260 C130 260 80 210 100 150 C120 90 200 80 250 110 C290 50 390 40 450 90 C510 50 600 80 620 140 C670 150 700 200 680 250 C650 280 590 270 550 260 Z"/>
    </svg>

    <!-- Nuvem 3 -->
    <svg class="cloud cloud-3" viewBox="0 0 500 250" xmlns="http://www.w3.org/2000/svg">
      <path d="M100 180 C60 180 30 150 45 110 C60 70 120 60 150 80 C180 40 240 30 280 60 C320 30 380 50 390 90 C430 100 450 130 430 170 Z"/>
    </svg>
  </div>

  <!-- Texto Principal -->
  <div class="content" id="interactive-area">
    <h1 id="title">gustavo<span class="dot">.</span></h1>
  </div>

  <script>
    const title = document.getElementById('title');
    const container = document.getElementById('interactive-area');

    // Movimento Parallax Ultra-suave com o Mouse
    let targetX = 0, targetY = 0;
    let currentX = 0, currentY = 0;

    window.addEventListener('mousemove', (e) => {
      const { innerWidth, innerHeight } = window;
      targetX = (e.clientX / innerWidth - 0.5) * 24;
      targetY = (e.clientY / innerHeight - 0.5) * 24;
    });

    // Interpolação contínua (Lerp) para animação de movimento macio
    function animate() {
      currentX += (targetX - currentX) * 0.08;
      currentY += (targetY - currentY) * 0.08;

      title.style.transform = `translate3d(${currentX}px, ${currentY}px, 0)`;
      requestAnimationFrame(animate);
    }
    animate();

    // Efeito Brisa/Onda ao clicar
    window.addEventListener('click', (e) => {
      const ripple = document.createElement('div');
      ripple.className = 'ripple';
      
      const size = Math.max(window.innerWidth, window.innerHeight) * 0.6;
      ripple.style.width = `${size}px`;
      ripple.style.height = `${size}px`;
      ripple.style.left = `${e.clientX - size / 2}px`;
      ripple.style.top = `${e.clientY - size / 2}px`;

      document.body.appendChild(ripple);

      setTimeout(() => {
        ripple.remove();
      }, 800);
    });
  </script>

</body>
</html>
