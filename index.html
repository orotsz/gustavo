```html
<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>gustavo.</title>

  <script defer src="/_vercel/insights/script.js"></script>

  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    html,
    body {
      width: 100%;
      height: 100%;
    }

    body {
      overflow: hidden;
      display: flex;
      align-items: center;
      justify-content: center;
      position: relative;

      background:
        radial-gradient(
          circle at center,
          #ffffff 0%,
          #f5f5f3 55%,
          #e9e9e6 100%
        );

      font-family: Arial, Helvetica, sans-serif;
    }

    body::before {
      content: "";
      position: absolute;

      width: 500px;
      height: 500px;

      top: -180px;
      left: -150px;

      border-radius: 50%;

      background: rgba(190, 200, 255, 0.18);

      filter: blur(100px);

      animation: moveLight 14s ease-in-out infinite alternate;

      pointer-events: none;
    }

    body::after {
      content: "";
      position: absolute;

      width: 500px;
      height: 500px;

      right: -180px;
      bottom: -200px;

      border-radius: 50%;

      background: rgba(220, 200, 255, 0.16);

      filter: blur(100px);

      animation: moveLight 16s ease-in-out infinite alternate-reverse;

      pointer-events: none;
    }

    .name {
      position: relative;
      z-index: 1;

      color: #111111;

      font-size: clamp(4rem, 11vw, 9rem);

      font-weight: 500;

      letter-spacing: -0.07em;

      user-select: none;

      animation: float 6s ease-in-out infinite;

      transition:
        opacity 0.4s ease,
        letter-spacing 0.4s ease;
    }

    .name:hover {
      opacity: 0.65;
      letter-spacing: -0.04em;
    }

    @keyframes float {
      0% {
        transform: translateY(0);
      }

      50% {
        transform: translateY(-14px);
      }

      100% {
        transform: translateY(0);
      }
    }

    @keyframes moveLight {
      0% {
        transform: translate(0, 0) scale(1);
      }

      50% {
        transform: translate(40px, 30px) scale(1.1);
      }

      100% {
        transform: translate(-20px, 50px) scale(1);
      }
    }

    @media (max-width: 600px) {
      .name {
        font-size: 18vw;
      }
    }

    @media (prefers-reduced-motion: reduce) {
      .name,
      body::before,
      body::after {
        animation: none;
      }
    }
  </style>
</head>

<body>

  <div class="name">gustavo.</div>

</body>
</html>
