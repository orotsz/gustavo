<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>gustavo</title>
  
  <style>
    /* Importa o arquivo da fonte baixado */
    @font-face {
      font-family: 'Taste Bread';
      src: url('Taste Bread.otf') format('opentype'),
           url('Taste Bread.ttf') format('truetype');
      font-weight: normal;
      font-style: normal;
    }

    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      background-color: #0a0a0a;
      color: #ffffff;
      font-family: 'Taste Bread', sans-serif;
      overflow: hidden;
    }

    h1 {
      font-size: clamp(4rem, 14vw, 11rem);
      letter-spacing: 0.02em;
      text-transform: lowercase;
      user-select: none;
      cursor: pointer;
      
      /* Transição suave de movimento */
      transition: transform 0.2s ease-out;
    }

    /* Animação ao clicar */
    h1:active {
      transform: scale(0.92) !important;
    }
  </style>

  <!-- Vercel Analytics -->
  <script defer src="/_vercel/insights/script.js"></script>
</head>
<body>

  <h1 id="title">gustavo</h1>

  <script>
    const title = document.getElementById('title');

    // Movimento responsivo e suave com o mouse
    window.addEventListener('mousemove', (e) => {
      const { innerWidth, innerHeight } = window;
      const x = (e.clientX / innerWidth - 0.5) * 30;
      const y = (e.clientY / innerHeight - 0.5) * 30;

      title.style.transform = `translate3d(${x}px, ${y}px, 0)`;
    });

    document.addEventListener('mouseleave', () => {
      title.style.transform = 'translate3d(0, 0, 0)';
    });
  </script>

</body>
</html>
